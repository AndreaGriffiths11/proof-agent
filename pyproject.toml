[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-agent"
version = "0.1.0"
description = "Adversarial verification for AI agent work"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/AndreaGriffiths11/proof-agent"

[project.scripts]
proof-agent-parse-verdict = "proof_agent.cli:parse_verdict_cli"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
